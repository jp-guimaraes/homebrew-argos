name: CI

# Builds and tests the formula on a real macOS runner (which, unlike an
# arbitrary local machine, has a healthy Homebrew) every time the formula
# changes -- this is where the tap's real validation happens, not on any
# one contributor's laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: brew style Formula/argos.rb
      - run: brew audit --strict --online Formula/argos.rb
      - run: brew install --build-from-source Formula/argos.rb
      - run: brew test argos
