name: CI

# Builds and tests the formula on a real macOS runner (which, unlike an
# arbitrary local machine, has a healthy Homebrew) every time the formula
# changes -- this is where the tap's real validation happens, not on any
# one contributor's laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: brew style Formula/argos.rb

      # `brew audit`/`install`/`test` want a tapped formula name, not a bare
      # path -- tapping the checkout itself as jp-guimaraes/argos (matching
      # this repo's real name once installed for real) gets that for free.
      - run: brew tap jp-guimaraes/argos "$PWD"
      - run: brew audit --strict --online jp-guimaraes/argos/argos
      - run: brew install --build-from-source jp-guimaraes/argos/argos
      - run: brew test jp-guimaraes/argos/argos
